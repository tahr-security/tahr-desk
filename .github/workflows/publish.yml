name: Publish image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish linux/amd64 image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ghcr-production
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          backend_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' backend/pyproject.toml | head -1)"
          frontend_version="$(jq -r .version frontend/package.json)"
          grep -Fq "## $version " CHANGELOG.md
          test "$version" = "$backend_version"
          test "$version" = "$frontend_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      - name: Create isolated Buildx builder
        run: docker buildx create --name tahr-desk-builder --driver docker-container --use
      - name: Build and publish with attestations
        env:
          IMAGE: ghcr.io/tahr-security/tahr-desk
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker buildx build \
            --file backend/Dockerfile \
            --platform linux/amd64 \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:sha-${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --attest type=provenance,mode=max \
            --attest type=sbom \
            --metadata-file image-metadata.json \
            --push \
            .
      - name: Record registry digest
        id: image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          digest="$(jq -er '."containerimage.digest"' image-metadata.json)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Published image"
            echo
            echo "\`ghcr.io/tahr-security/tahr-desk@$digest\`"
            echo
            echo "Version: \`$VERSION\`"
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Platform: \`linux/amd64\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload publication metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-metadata-${{ steps.release.outputs.version }}
          path: image-metadata.json
          retention-days: 90
      - name: Remove Buildx builder
        if: always()
        run: docker buildx rm tahr-desk-builder || true

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The 0.x generator line requires an explicit client migration.
      - dependency-name: "@hey-api/openapi-ts"
        versions: [">= 0.98.0"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    groups:
      container:
        patterns: ["*"]
    ignore:
      # Keep production on the supported stable Python 3.14 line.
      - dependency-name: python
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        versions: [">= 3.15"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      compose:
        patterns: ["*"]
